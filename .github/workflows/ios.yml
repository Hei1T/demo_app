name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Flutter pub get
        working-directory: apps/app
        run: flutter pub get

      - name: Build iOS (no codesign)
        working-directory: apps/app
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE=https://nfc.example.com

      - name: Package unsigned IPA
        working-directory: apps/app
        run: |
          set -e
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Runner.app not found"
            ls -R build/ios | head -80
            exit 1
          fi
          mkdir -p Payload
          rm -rf Payload/Runner.app
          cp -R "$APP_PATH" Payload/
          rm -f Runner.ipa
          zip -r -q Runner.ipa Payload
          ls -lh Runner.ipa
          shasum -a 256 Runner.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-ipa
          path: apps/app/Runner.ipa
          retention-days: 30

      # 同时发布到 Release，公开可下载（Artifacts 需要登录）
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: iOS Build ${{ github.run_number }}
          body: |
            自动构建的未签名 IPA，用 Sideloadly 安装。
            有效期 7 天（免费 Apple ID 签名）。
          files: apps/app/Runner.ipa
          draft: false
          prerelease: false
